<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi Siswa SDIT AL FAJRI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md py-6 px-4 mb-6 text-center">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">PRESENSI SISWA</h1>
    <p class="text-indigo-200 text-sm mt-1">SDIT AL FAJRI - Realtime Attendance System</p>
  </header>

  <main class="max-w-5xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- FORM INPUT / SCANNER (Kiri - 1 Kolom) -->
    <section class="md:col-span-1 space-y-6">
      
      <!-- Card Input Manual -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2 flex items-center gap-2">
          <span>📝</span> Input Presensi Manual
        </h2>

        <form id="formPresensi" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">NIS SISWA</label>
            <input type="text" id="inputNIS" required placeholder="Contoh: 12345"
              class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">NAMA LENGKAP</label>
            <input type="text" id="inputNama" required placeholder="Sesuai nama di Sheet Siswa"
              class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">KATEGORI</label>
              <select id="inputKategori" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                <option value="Harian Sekolah">Harian Sekolah</option>
                <option value="Kegiatan Ekstra">Kegiatan Ekstra</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">STATUS</label>
              <select id="inputStatus" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">KETERANGAN (OPSIONAL)</label>
            <input type="text" id="inputKeterangan" placeholder="Catatan tambahan..."
              class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          </div>

          <button type="submit" id="btnSubmit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-all text-sm flex justify-center items-center gap-2">
            <span>Simpan Presensi</span>
          </button>
        </form>
      </div>

      <!-- Card Scanner Barcode -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-700 mb-3 flex items-center gap-2">
          <span>📷</span> Scan Barcode / QR
        </h2>
        <div id="reader" class="overflow-hidden rounded-lg border bg-slate-50"></div>
        <p class="text-xs text-slate-500 mt-2 text-center">*Arahkan kamera ke Barcode Kartu Pelajar</p>
      </div>

    </section>

    <!-- TABEL REKAP (Kanan - 2 Kolom) -->
    <section class="md:col-span-2">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        
        <div class="flex justify-between items-center mb-4 border-b pb-3">
          <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
            <span>📊</span> Rekap Presensi
          </h2>
          <button onclick="fetchRekapData()"
            class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-3 py-1.5 rounded-md border transition">
            🔄 Refresh
          </button>
        </div>

        <!-- Feedback Alert Container -->
        <div id="alertMessage" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- Table Container -->
        <div class="overflow-x-auto min-h-[300px]">
          <table class="w-full text-left text-xs sm:text-sm text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase font-bold text-[11px] border-b">
              <tr>
                <th class="py-3 px-3">Waktu</th>
                <th class="py-3 px-3">NIS</th>
                <th class="py-3 px-3">Nama</th>
                <th class="py-3 px-3">Kelas</th>
                <th class="py-3 px-3">Status</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100">
              <tr>
                <td colspan="5" class="py-8 text-center text-slate-400">Memuat data presensi...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </section>

  </main>

  <script>
    // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtKHKf0TvXSD9bpz2a2pE_1CLVmu2BsEBsypyVU0HYH1kz--YMUp0YJTMWZNI_U-6L/exec";

    // Standard DOM Load
    document.addEventListener("DOMContentLoaded", () => {
      fetchRekapData();
      initScanner();
    });

    // 1. FUNGSI SUBMIT PRESENSI MANUAL (Validasi NIS + Nama)
    async function handleFormSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById("btnSubmit");
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span>Memproses...</span>`;

      const payload = {
        studentId: document.getElementById("inputNIS").value.trim(),
        nama: document.getElementById("inputNama").value.trim(),
        kategori: document.getElementById("inputKategori").value,
        status: document.getElementById("inputStatus").value,
        keterangan: document.getElementById("inputKeterangan").value.trim()
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showAlert(result.message, "success");
          document.getElementById("formPresensi").reset();
          fetchRekapData(); // Refresh Tabel
        } else {
          // Menampilkan Notifikasi Error jika NIS & Nama tidak cocok
          showAlert(result.message, "error");
        }
      } catch (err) {
        showAlert("Gagal terhubung ke Google Sheets Server!", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // 2. FUNGSI MEMUAT DATA REKAP (GET)
    async function fetchRekapData() {
      const tbody = document.getElementById("tableBody");
      
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="py-8 text-center text-slate-400">Belum ada data presensi hari ini.</td>
            </tr>`;
          return;
        }

        // Tampilkan 15 data presensi terbaru di paling atas
        const latestData = data.reverse().slice(0, 15);

        tbody.innerHTML = latestData.map(item => `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-2.5 px-3 whitespace-nowrap">
              <span class="font-medium text-slate-800">${item.waktu || "-"}</span>
              <span class="block text-[10px] text-slate-400">${item.tanggal || ""}</span>
            </td>
            <td class="py-2.5 px-3 font-mono text-xs">${item.studentId}</td>
            <td class="py-2.5 px-3 font-semibold text-slate-800">${item.nama}</td>
            <td class="py-2.5 px-3">${item.kelas}</td>
            <td class="py-2.5 px-3">
              <span class="px-2 py-1 rounded-full text-[11px] font-bold ${getStatusBadge(item.status)}">
                ${item.status}
              </span>
            </td>
          </tr>
        `).join("");

      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-6 text-center text-red-500 font-medium">
              ❌ Gagal memuat data dari Google Sheets. Periksa koneksi atau URL Apps Script.
            </td>
          </tr>`;
      }
    }

    // Utility: Badge Warna Status
    function getStatusBadge(status) {
      switch (status) {
        case "Hadir": return "bg-emerald-100 text-emerald-700";
        case "Izin": return "bg-amber-100 text-amber-700";
        case "Sakit": return "bg-rose-100 text-rose-700";
        default: return "bg-slate-100 text-slate-600";
      }
    }

    // Utility: Tampilkan Notifikasi Pesan Sukses / Error
    function showAlert(msg, type) {
      const alertBox = document.getElementById("alertMessage");
      alertBox.classList.remove("hidden", "bg-emerald-100", "text-emerald-800", "bg-rose-100", "text-rose-800");

      if (type === "success") {
        alertBox.classList.add("bg-emerald-100", "text-emerald-800");
        alertBox.innerHTML = `✅ ${msg}`;
      } else {
        alertBox.classList.add("bg-rose-100", "text-rose-800");
        alertBox.innerHTML = `⚠️ ${msg}`;
      }

      // Sembunyikan notifikasi setelah 5 detik
      setTimeout(() => {
        alertBox.classList.add("hidden");
      }, 5000);
    }

    // 3. FUNGSI SCANNER BARCODE
    function initScanner() {
      const html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 150 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
          // Isi NIS otomatis saat barcode ter-scan
          document.getElementById("inputNIS").value = decodedText;
          showAlert(`Barcode NIS terdeteksi: ${decodedText}. Silakan masukkan nama lengkap untuk verifikasi.`, "success");
        },
        (errorMessage) => {
          // Error scanning wajar jika kamera belum menangkap objek jelas
        }
      ).catch(err => {
        console.warn("Kamera tidak diizinkan atau tidak ditemukan.");
      });
    }
  </script>
</body>
</html>
