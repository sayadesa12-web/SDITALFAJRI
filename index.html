<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Absensi SD - Tech Emerald Edition</title>
    <!-- HTML5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-dark: #07120e;
            --card-bg: rgba(13, 27, 21, 0.85);
            --emerald-primary: #00e676;
            --emerald-glow: #00ff88;
            --emerald-dark: #004d40;
            --text-light: #e8f5e9;
            --text-muted: #81c784;
            --danger: #ff5252;
            --warning: #ffd700;
            --info: #00e5ff;
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top center, #0f2b20 0%, var(--bg-dark) 80%);
            color: var(--text-light);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER & CLOCK */
        .header-card {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 16px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.15);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 26px;
            color: var(--emerald-primary);
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
            letter-spacing: 1px;
        }

        .header-title p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .clock-widget {
            text-align: right;
        }

        #digital-clock {
            font-size: 28px;
            font-weight: bold;
            color: var(--emerald-glow);
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
            font-family: 'Courier New', Courier, monospace;
        }

        #digital-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* MAIN LAYOUT */
        .main-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 230, 118, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--emerald-primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(0, 230, 118, 0.2);
            padding-bottom: 8px;
        }

        /* CONTROL OPTIONS */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(4, 15, 11, 0.8);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--emerald-primary);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }

        .radio-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .radio-btn {
            position: relative;
        }

        .radio-btn input { display: none; }

        .radio-btn label {
            display: block;
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 230, 118, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .radio-btn input:checked + label {
            background: var(--emerald-dark);
            border-color: var(--emerald-primary);
            color: var(--emerald-glow);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        /* AUTO COMPLETE LIST */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-items {
            position: absolute;
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background: #0b1a14;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 8px 8px;
        }
        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .autocomplete-items div:hover { background-color: var(--emerald-dark); }

        /* SCANNER & CAMERA */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed rgba(0, 230, 118, 0.4);
            background: #000;
        }

        /* LOG & HISTORY */
        .log-list {
            flex: 1;
            overflow-y: auto;
            max-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--emerald-primary);
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .log-info strong { color: var(--emerald-glow); display: block; font-size: 14px; }
        .log-info span { color: var(--text-muted); font-size: 11px; }
        .log-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            background: var(--emerald-dark);
            color: var(--emerald-primary);
        }

        /* RESULT STATUS BOX */
        #status-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            font-size: 14px;
        }

        /* ACTION BUTTONS */
        .btn-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--emerald-dark), var(--emerald-primary));
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-print {
            background: linear-gradient(135deg, #00838f, #00e5ff);
            color: #000;
            margin-top: 15px;
        }

        /* MODAL CETAK */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-body {
            background: #0b1a14;
            border: 1px solid var(--emerald-primary);
            width: 90%; max-width: 500px;
            padding: 25px; border-radius: 12px;
        }

        /* PRINT STYLES */
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; }
            table { width: 100%; border-collapse: collapse; margin-top: 15px; }
            th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header-card">
        <div class="header-title">
            <h1>SMART ABSENSI SD</h1>
            <p>Sistem Presensi Harian & Ekstrakurikuler Integratif</p>
        </div>
        <div class="clock-widget">
            <div id="digital-clock">00:00:00</div>
            <div id="digital-date">Memuat Tanggal...</div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">

        <!-- PANEL KIRI: SCANNER & INPUT -->
        <div class="panel-card">
            <div class="panel-title">📷 Pemindai QR / Input Manual</div>

            <div class="form-group">
                <label>Kategori Kegiatan:</label>
                <select id="select-kategori">
                    <option value="Harian">Absensi Harian Sekolah</option>
                    <option value="Pramuka">Ekskul Pramuka</option>
                    <option value="Taekwondo">Ekskul Taekwondo</option>
                    <option value="Menari">Ekskul Menari</option>
                    <option value="Marawis">Ekskul Marawis</option>
                </select>
            </div>

            <div class="form-group">
                <label>Status Kehadiran:</label>
                <div class="radio-options">
                    <div class="radio-btn">
                        <input type="radio" id="st-hadir" name="status" value="Hadir" checked>
                        <label for="st-hadir">Hadir</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" id="st-izin" name="status" value="Izin">
                        <label for="st-izin">Izin</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" id="st-sakit" name="status" value="Sakit">
                        <label for="st-sakit">Sakit</label>
                    </div>
                </div>
            </div>

            <div id="reader"></div>

            <div id="status-box"></div>

            <div class="form-group autocomplete-wrapper" style="margin-top: 15px;">
                <label>Ketik NIS / Nama Siswa:</label>
                <input type="text" id="input-keyword" placeholder="Ketik NIS atau Nama Siswa..." autocomplete="off">
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>

            <button class="btn-action" onclick="prosesManual()">Proses Absen</button>
        </div>

        <!-- PANEL KANAN: LOG RIWAYAT & CETAK -->
        <div class="panel-card">
            <div class="panel-title">📋 Riwayat Absensi Terkini</div>
            
            <div class="log-list" id="log-container">
                <div style="text-align: center; color: var(--text-muted); padding: 20px;">Belum ada aktivitas scan...</div>
            </div>

            <button class="btn-action btn-print" onclick="bukaModalCetak()">🖨️ Cetak Laporan Harian</button>
        </div>

    </div>

    <!-- MODAL FILTER CETAK HARIAN -->
    <div class="modal-overlay" id="modal-cetak">
        <div class="modal-body">
            <h3 style="color: var(--emerald-primary); margin-top: 0;">Filter Cetak Laporan Harian</h3>
            <div class="form-group">
                <label>Pilih Kelas:</label>
                <select id="filter-kelas">
                    <option value="SEMUA">Semua Kelas</option>
                    <option value="KELAS 1">Kelas 1</option>
                    <option value="KELAS 2">Kelas 2</option>
                    <option value="KELAS 3">Kelas 3</option>
                    <option value="KELAS 4">Kelas 4</option>
                    <option value="KELAS 5">Kelas 5</option>
                    <option value="KELAS 6">Kelas 6</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tanggal:</label>
                <input type="date" id="filter-tanggal">
            </div>
            <button class="btn-action" onclick="eksekusiCetak()">Cetak Sekarang</button>
            <button class="btn-action" style="background: var(--danger); color: #fff; margin-top: 8px;" onclick="tutupModalCetak()">Batal</button>
        </div>
    </div>

    <!-- SECTION HIDDEN FOR PRINTING -->
    <div id="print-section" style="display: none;">
        <h2 style="text-align: center; margin-bottom: 5px;">LAPORAN PRESENSI HARIAN SISWA SD</h2>
        <p style="text-align: center; margin-top: 0;" id="print-subtitle"></p>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIS</th>
                    <th>Nama Siswa</th>
                    <th>Kelas</th>
                    <th>Kategori</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="print-table-body"></tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // CONFIG & BACKEND URL
        // ==========================================
        // PASTEKAN URL APPS SCRIPT ANDA DI SINI
        const scriptURL = 'https://script.google.com/macros/s/AKfycbypo8q3kAaXspXbGS20zMVytMG_7mR96NM9L5-8yxUS_epkWPkMlSTalfYa72mfxVKC/exec';
        
        let databaseSiswa = [];
        let isProcessing = false;

        // 1. JAM & TANGGAL REALTIME
        function updateClock() {
            const now = new Date();
            const jam = String(now.getHours()).padStart(2, '0');
            const menit = String(now.getMinutes()).padStart(2, '0');
            const detik = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digital-clock').innerText = `${jam}:${menit}:${detik}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('digital-date').innerText = now.toLocaleDateString('id-ID', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Set default filter tanggal cetak ke hari ini
        document.getElementById('filter-tanggal').valueToDate = new Date();
        document.getElementById('filter-tanggal').value = new Date().toISOString().substring(0, 10);

        // 2. FITUR SUARA (TEXT-TO-SPEECH)
        function bersuaraNama(nama) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(`Terima kasih, ${nama}`);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 3. LOAD DATA SISWA UNTUK AUTOCOMPLETE
        function loadMasterSiswa() {
            fetch(`${scriptURL}?action=getSiswa`)
                .then(res => res.json())
                .then(data => {
                    databaseSiswa = data;
                })
                .catch(err => console.log("Gagal memuat data siswa untuk autocomplete"));
        }
        loadMasterSiswa();

        // 4. AUTOCOMPLETE LOGIC
        const inputKeyword = document.getElementById("input-keyword");
        const listContainer = document.getElementById("autocomplete-list");

        inputKeyword.addEventListener("input", function() {
            const val = this.value;
            listContainer.innerHTML = "";
            if (!val || val.length < 2) return;

            const matches = databaseSiswa.filter(s => 
                s.nama.toLowerCase().includes(val.toLowerCase()) || 
                s.nis.toString().toLowerCase().includes(val.toLowerCase())
            );

            matches.slice(0, 5).forEach(s => {
                const item = document.createElement("DIV");
                item.innerHTML = `<strong>${s.nama}</strong> (${s.kelas}) - NIS: ${s.nis}`;
                item.addEventListener("click", function() {
                    inputKeyword.value = s.nis;
                    listContainer.innerHTML = "";
                });
                listContainer.appendChild(item);
            });
        });

        document.addEventListener("click", function (e) {
            if (e.target !== inputKeyword) listContainer.innerHTML = "";
        });

        // 5. PROSES ABSENSI
        function prosesManual() {
            const val = inputKeyword.value.trim();
            if (!val) { alert("NIS atau Nama Wajib Diisi!"); return; }
            kirimDataAbsen(val);
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            kirimDataAbsen(decodedText.trim());
        }

        function kirimDataAbsen(keyword) {
            isProcessing = true;
            const kategori = document.getElementById('select-kategori').value;
            const status = document.querySelector('input[name="status"]:checked').value;
            const statusBox = document.getElementById('status-box');

            statusBox.style.display = 'block';
            statusBox.style.background = 'rgba(0, 229, 255, 0.2)';
            statusBox.style.color = 'var(--info)';
            statusBox.innerText = '⏳ Memproses data...';

            const targetUrl = `${scriptURL}?keyword=${encodeURIComponent(keyword)}&kategori=${encodeURIComponent(kategori)}&status=${encodeURIComponent(status)}`;

            fetch(targetUrl)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "SUCCESS") {
                        statusBox.style.background = 'rgba(0, 230, 118, 0.2)';
                        statusBox.style.color = 'var(--emerald-glow)';
                        statusBox.innerText = `✅ [${res.statusAbsen}] ${res.nama} (${res.kelas})`;
                        
                        bersuaraNama(res.nama);
                        tambahLog(res.nama, res.kelas, res.kategori, res.statusAbsen);
                        inputKeyword.value = "";
                    } else {
                        statusBox.style.background = 'rgba(255, 82, 82, 0.2)';
                        statusBox.style.color = 'var(--danger)';
                        statusBox.innerText = `❌ ${res.message}`;
                    }

                    setTimeout(() => {
                        statusBox.style.display = 'none';
                        isProcessing = false;
                    }, 2500);
                })
                .catch(err => {
                    statusBox.style.background = 'rgba(255, 82, 82, 0.2)';
                    statusBox.style.color = 'var(--danger)';
                    statusBox.innerText = '❌ Gagal Terhubung ke Database!';
                    setTimeout(() => {
                        statusBox.style.display = 'none';
                        isProcessing = false;
                    }, 2500);
                });
        }

        // 6. LOG TAMBAH KE TABEL RIWAYAT
        function tambahLog(nama, kelas, kategori, status) {
            const container = document.getElementById('log-container');
            if (container.innerHTML.includes("Belum ada aktivitas")) container.innerHTML = "";

            const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <div class="log-info">
                    <strong>${nama} (${kelas})</strong>
                    <span>${kategori} • ${timeStr} WIB</span>
                </div>
                <div class="log-badge">${status}</div>
            `;
            container.prepend(div);
        }

        // 7. KAMERA SCANNER INIT
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 220, height: 220 },
            rememberLastUsedCamera: true
        }, false);
        html5QrcodeScanner.render(onScanSuccess);

        // 8. LOGIK CETAK
        function bukaModalCetak() { document.getElementById('modal-cetak').style.display = 'flex'; }
        function tutupModalCetak() { document.getElementById('modal-cetak').style.display = 'none'; }

        function eksekusiCetak() {
            const kelas = document.getElementById('filter-kelas').value;
            const tanggal = document.getElementById('filter-tanggal').value;

            fetch(`${scriptURL}?action=getRekapHarian&kelas=${encodeURIComponent(kelas)}&tanggal=${encodeURIComponent(tanggal)}`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('print-table-body');
                    tbody.innerHTML = "";
                    document.getElementById('print-subtitle').innerText = `Kelas: ${kelas} | Tanggal: ${tanggal}`;

                    if(data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Tidak ada data absensi untuk filter ini</td></tr>`;
                    } else {
                        data.forEach((row, i) => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${i+1}</td>
                                    <td>${row.nis}</td>
                                    <td>${row.nama}</td>
                                    <td>${row.kelas}</td>
                                    <td>${row.kategori}</td>
                                    <td>${row.status}</td>
                                </tr>
                            `;
                        });
                    }

                    tutupModalCetak();
                    window.print();
                });
        }
    </script>
</body>
</html>
